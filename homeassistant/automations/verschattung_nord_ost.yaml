alias: Verschattung Nord/Ost (temperaturbasiert, Regen+kühl-Override)
description: >
  Sonnenschutz für die Räume ohne Helligkeitssensor (Nord-/Ostseite, keine
  direkte Wärmestrahlung, daher reicht Temperatur allein):
    cover.schlafzimmer  <- sensor.klima_schlafzimmer_temperature
    cover.badezimmer           <- sensor.klima_bad_temperature
    cover.wc            <- sensor.klima_wc_temperature
    cover.wohnzimmer    <- sensor.klima_kuche_temperature (Küche)
    cover.terrasse      <- sensor.klima_kuche_temperature (Küche)

  Kein Helligkeits-, Außentemp- oder Vorhersage-Faktor wie bei Süd/West - nur
  der jeweilige Innentemp-Sensor als alleiniger Trigger, mit 2°C Hysterese
  zwischen Schließen und Öffnen, um Flackern zu vermeiden:
    Schließen: Innentemp > 23°C, 5 Min. stabil
    Öffnen: Innentemp < 21°C, 5 Min. stabil
  Zielposition beim Verschatten: Schlafzimmer 78%, alle anderen 50% -
  siehe Variable "positionen", die einzige Stelle mit diesen Werten.

  ZUSÄTZLICH (für alle 5 Räume gemeinsam):
    Außentemp > 25°C (5 Min. stabil) UND Vorhersage-Max-Temp heute > 25°C
      -> alle 5 auf ihre Zielposition, unabhängig vom Innentemp-Wert.
    Außentemp < 25°C -> alle 5 wieder öffnen, ABER nur die, die gerade
      NICHT komplett geschlossen (0%, state "closed") sind.

  Absicherung gegen Positions-Drift, Stand 26.07.2026, nach wiederholten
  Overshoot-Vorfällen (Schlafzimmer schoss trotz Ziel 50% mehrfach bis auf 0%
  durch). Ursache sind NICHT Controller oder Anbindung, sondern die
  EnOcean-Aktoren selbst: sie arbeiten mit Laufzeiten und haben keine
  Positionssensoren. Die gemeldete Position ist eine Schätzung, keine Messung -
  ein Wechsel des Controllers ändert daran nichts, die Absicherung bleibt also
  nötig:
    - Nach jedem set_cover_position wird 20 Sek. gewartet und geprüft, ob
      der Rolladen trotzdem komplett geschlossen gelandet ist. Falls ja,
      wird EINMALIG nachkorrigiert (erneut auf Zielposition gesetzt),
      statt auf den nächsten 10-Minuten-Zyklus zu warten.
    - periodic_check (Backup-Trigger, alle 10 Min.) darf nur noch aktiv
      werden, wenn die aktuelle Position noch deutlich offen ist (>80%) -
      verhindert, dass der Backup-Trigger denselben driftgefährdeten
      Fahrbefehl alle 10 Minuten erneut auslöst und die Overshoot-Gefahr
      dadurch vervielfacht (das war vermutlich der Hauptverstärker des
      Vorfalls vom 26.07.).

  TERRASSE - AUSSPERRSCHUTZ (ergänzt):
    cover.terrasse wird beim Schließen übersprungen, solange die
    Terrassentür offen ist ODER input_boolean.party_terrasse an ist.
    Beobachtet wurde, dass der Rolladen bei offener Tür in
    Verschattungsposition fuhr - man sitzt draußen und steht vor einem
    heruntergefahrenen Rolladen. Der Türkontakt ist nicht invertiert,
    überträgt seinen Status aber nicht immer; verpasst er das Öffnen,
    hielt Home Assistant die Tür für zu und der Guard gab frei.
    Zwei Konsequenzen daraus:
      - Der Türkontakt zählt nur noch dann als "zu", wenn er das
        ausdrücklich meldet. "unknown", "unavailable" und ein verpasstes
        Update gelten als offen.
      - Der Party-Schalter sperrt die Terrasse zusätzlich, unabhängig vom
        Sensor. Das ist die einzige Absicherung, die nicht an dessen
        Zuverlässigkeit hängt - bei längerem Aufenthalt draußen also der
        verlässliche Weg.
    Betrifft beide Zweige, die die Terrasse schließen (der eigene und
    "alle 5 proaktiv"). Das Wohnzimmer ist NICHT betroffen.

  Absicherung gegen "Aufwecken" nachts komplett geschlossener Rolladen: auch die
  Schließen- UND Öffnen-Zweige überspringen Rolladen, die bereits state "closed"
  (Position 0) sind - das greift weiterhin für echte nächtliche Vollschließung
  (Schichterkennung), da diese Automation dort nicht eingreift.

  SCHICHTMODUS HAT VORRANG (ergänzt):
    Der "closed"-Check oben schützt den Tagschlaf nach der Nachtschicht nur,
    solange der Rolladen exakt auf Position 0 steht. Genau das ist bei der
    dokumentierten Positions-Drift aber nicht garantiert - landet er auf 2%,
    ist sein State "open" und diese Automation würde ihn mitten im Tagschlaf
    wieder hochfahren. Deshalb wird cover.schlafzimmer zusätzlich immer dann
    übersprungen, wenn input_select.schichtmodus_schlafzimmer auf "nacht"
    steht. Betrifft alle vier Zweige, die diesen Rolladen anfassen.

    Bewusst NUR "nacht": "spaet" steht von der Abfahrt am frühen Nachmittag
    bis zum nächsten Morgen und würde die Verschattung im halben Tag
    aussperren, "frueh" sogar bis 21:30. Beide Fälle brauchen den Schutz
    nicht - da ist der Rolladen zur Schlafenszeit ohnehin über den
    Sonnenuntergang geschlossen.

    Das Sicherheitsnetz um 16:00 in der Schichterkennung setzt den Modus auf
    "keine", bevor es den Rolladen öffnet. Diese Automation ist damit im
    selben Moment wieder zuständig und zieht ihn auf Verschattungsposition -
    was auch die Klimaanlage entsperrt, die bei geschlossenem Rolladen
    blockiert ist.

  REGEN + KÜHL ÜBERSTIMMT DIE INNENTEMP (ergänzt 22.08.2026):
    Die reine Innentemp-Logik oben hatte eine Lücke: steigt die Innentemp
    durch interne Wärmequellen (Kochen, Elektronik, Personen) über 23°C,
    verschattet diese Automation auch dann, wenn draußen Regen und kühle
    Temperaturen herrschen - obwohl es dort gar keine Sonne zum Blocken gibt
    und Verschatten den Raum nur unnötig verdunkelt.
    Neue Bedingung "regen_kuehl": weather.forecast_home in
    [rainy, pouring, lightning-rainy] UND Außentemp < 22°C. Solange das
    zutrifft:
      - werden alle vier Schließen-Zweige blockiert (zusätzliche Bedingung
        "not regen_kuehl"),
      - fährt ein neuer, eigener Zweig alle 5 Rolladen aktiv wieder hoch -
        auch wenn die jeweilige Innentemp noch über 21°C liegt. Er respektiert
        weiterhin den Schichtmodus-Schutz fürs Schlafzimmer und überspringt
        bereits komplett geschlossene Rolladen (state "closed"), genau wie
        die bestehenden Öffnen-Zweige.
    Der "Außentemp > 25°C UND Vorhersage > 25°C"-Zweig braucht keine eigene
    Ausnahme: Außentemp > 25°C und < 22°C schließen sich gegenseitig aus.

    KORREKTUR (ergänzt 22.08.2026, im Test aufgefallen): der Öffnen-Zweig
    hatte anfangs zusätzlich zu "regen_kuehl" eine Trigger-Einschränkung
    (nur bei regen_kuehl_open/periodic_check). Damit blockierte z.B. ein
    Innentemp-Trigger (wz_terrasse_close bei Küchentemp > 23°C) zwar
    korrekt den zugehörigen Schließen-Zweig, matchte aber auch den
    Öffnen-Zweig nicht mehr - kein choose-Zweig traf zu, die Rolladen
    blieben bis zum nächsten periodic_check (bis zu 10 Min.) stehen, statt
    sofort hochzufahren. Die Trigger-Einschränkung ist jetzt entfernt:
    "regen_kuehl" allein entscheidet, unabhängig vom auslösenden Trigger.
triggers:
  - trigger: numeric_state
    entity_id: sensor.klima_schlafzimmer_temperature
    above: 23
    for:
      minutes: 5
    id: schlafzimmer_close
  - trigger: numeric_state
    entity_id: sensor.klima_schlafzimmer_temperature
    below: 21
    for:
      minutes: 5
    id: schlafzimmer_open
  - trigger: numeric_state
    entity_id: sensor.klima_bad_temperature
    above: 23
    for:
      minutes: 5
    id: bad_close
  - trigger: numeric_state
    entity_id: sensor.klima_bad_temperature
    below: 21
    for:
      minutes: 5
    id: bad_open
  - trigger: numeric_state
    entity_id: sensor.klima_wc_temperature
    above: 23
    for:
      minutes: 5
    id: wc_close
  - trigger: numeric_state
    entity_id: sensor.klima_wc_temperature
    below: 21
    for:
      minutes: 5
    id: wc_open
  - trigger: numeric_state
    entity_id: sensor.klima_kuche_temperature
    above: 23
    for:
      minutes: 5
    id: wz_terrasse_close
  - trigger: numeric_state
    entity_id: sensor.klima_kuche_temperature
    below: 21
    for:
      minutes: 5
    id: wz_terrasse_open
  - trigger: numeric_state
    entity_id: sensor.wkh_temperature_outside
    above: 25
    for:
      minutes: 5
    id: forecast_close_all
  - trigger: numeric_state
    entity_id: sensor.wkh_temperature_outside
    below: 25
    for:
      minutes: 5
    id: outdoor_open_all
  - trigger: time_pattern
    minutes: /10
    id: periodic_check
  - trigger: state
    entity_id: weather.forecast_home
    to:
      - rainy
      - pouring
      - lightning-rainy
    id: regen_kuehl_open
conditions: []
actions:
  - variables:
      # Zielpositionen beim Verschatten - EINZIGE Stelle, an der sie stehen.
      # Vorher waren sie über die Zweige verteilt: das Schlafzimmer wurde auf
      # 78 gefahren, die "steht schon nah genug"-Prüfung verglich aber noch
      # gegen 70, und der gemeinsame "alle 5"-Zweig fuhr es auf 50. Fahrbefehl
      # und Prüfung holen den Wert jetzt beide von hier.
      positionen:
        cover.schlafzimmer: 78
        cover.badezimmer: 50
        cover.wc: 50
        cover.wohnzimmer: 50
        cover.terrasse: 50
      # Der Türkontakt überträgt seinen Status nicht immer zuverlässig.
      # Deshalb gilt die Tür NUR dann als zu, wenn er das ausdrücklich meldet -
      # "unknown", "unavailable" oder ein verpasstes Update zählen als offen.
      # Fehlerrichtung: im Zweifel nicht verschatten. Das kostet nur etwas
      # Wärme, während die Gegenrichtung heißt, dass jemand vor einem
      # heruntergefahrenen Rolladen auf der Terrasse steht.
      tuer_offen: >-
        {{ not is_state('binary_sensor.terrassenturkontakt_contact', 'off') }}
      # Zweiter, manueller Riegel: solange der Party-Schalter an ist, wird die
      # Terrasse gar nicht angefasst - unabhängig davon, was der Türkontakt
      # gerade meldet oder ob er die letzte Änderung übertragen hat. Das ist
      # die einzige Absicherung, die nicht an der Zuverlässigkeit des Sensors
      # hängt.
      terrasse_gesperrt: >-
        {{ tuer_offen or is_state('input_boolean.party_terrasse', 'on') }}
      # Wie weit darf die tatsächliche Position unter der Zielposition liegen,
      # bevor nachkorrigiert wird.
      drift_toleranz: 5
      # Solange dieser Modus aktiv ist, wird cover.schlafzimmer nicht
      # angefasst - Tagschlaf nach der Nachtschicht.
      schlafzimmer_gesperrt: >
        {{ is_state('input_select.schichtmodus_schlafzimmer', 'nacht') }}
      # Regen + kühl draußen - dann bringt Verschatten nichts, es gibt keine
      # Sonne zu blocken. Überstimmt die reine Innentemp-Logik, siehe
      # description.
      regen_kuehl: >
        {{ states('weather.forecast_home') in ['rainy', 'pouring', 'lightning-rainy']
           and states('sensor.wkh_temperature_outside') | float(100) < 22 }}
  - choose:
      - alias: Schlafzimmer - Schließen
        conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: schlafzimmer_close
              - condition: and
                conditions:
                  - condition: trigger
                    id: periodic_check
                  - condition: numeric_state
                    entity_id: sensor.klima_schlafzimmer_temperature
                    above: 23
          # Schichtmodus hat Vorrang - siehe description.
          - condition: template
            value_template: "{{ not schlafzimmer_gesperrt }}"
          # Regen + kühl draußen - dann bringt Verschatten nichts, siehe
          # description.
          - condition: template
            value_template: "{{ not regen_kuehl }}"
          - condition: not
            conditions:
              - condition: state
                entity_id: cover.schlafzimmer
                state: closed
          - condition: template
            value_template: >
              {{ (trigger.id == 'periodic_check' and
              (state_attr('cover.schlafzimmer','current_position') | int(0)) >
              80)
                 or (trigger.id != 'periodic_check' and (state_attr('cover.schlafzimmer','current_position') | int(0) - positionen['cover.schlafzimmer']) | abs > 5) }}
        sequence:
          - action: cover.stop_cover
            target:
              entity_id: cover.schlafzimmer
          - delay:
              seconds: 1
          - action: cover.set_cover_position
            target:
              entity_id: cover.schlafzimmer
            data:
              position: "{{ positionen['cover.schlafzimmer'] }}"
          - delay:
              seconds: 20
          # Zu weit zugefahren? Nicht nur "ganz zu": bei Drift bleibt der
          # Rolladen auch mal auf halbem Weg stehen, sein State ist dann
          # "open" und die Korrektur lief nie an.
          - if:
              - condition: template
                value_template: >-
                  {{ is_state('cover.schlafzimmer', 'closed')
                     or (state_attr('cover.schlafzimmer', 'current_position') is not none
                            and state_attr('cover.schlafzimmer', 'current_position') | int(0)
                                < positionen['cover.schlafzimmer'] - drift_toleranz) }}
            then:
              - action: cover.set_cover_position
                target:
                  entity_id: cover.schlafzimmer
                data:
                  position: "{{ positionen['cover.schlafzimmer'] }}"
              - action: logbook.log
                data:
                  entity_id: cover.schlafzimmer
                  name: Verschattung Nord/Ost
                  message: >-
                    Positions-Drift erkannt (Ziel
                    {{ positionen['cover.schlafzimmer'] }}%, tatsächlich
                    {{ state_attr('cover.schlafzimmer', 'current_position') }}%) -
                    Zielposition erneut angefahren.
      - alias: Schlafzimmer - Öffnen
        conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: schlafzimmer_open
              - condition: and
                conditions:
                  - condition: trigger
                    id: periodic_check
                  - condition: numeric_state
                    entity_id: sensor.klima_schlafzimmer_temperature
                    below: 21
          # Schichtmodus hat Vorrang - der wichtigste der vier Zweige: hier
          # würde der Rolladen mitten im Tagschlaf hochfahren.
          - condition: template
            value_template: "{{ not schlafzimmer_gesperrt }}"
          - condition: not
            conditions:
              - condition: state
                entity_id: cover.schlafzimmer
                state: closed
        sequence:
          - action: cover.open_cover
            target:
              entity_id: cover.schlafzimmer
      - alias: Bad - Schließen
        conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: bad_close
              - condition: and
                conditions:
                  - condition: trigger
                    id: periodic_check
                  - condition: numeric_state
                    entity_id: sensor.klima_bad_temperature
                    above: 23
          # Regen + kühl draußen - dann bringt Verschatten nichts, siehe
          # description.
          - condition: template
            value_template: "{{ not regen_kuehl }}"
          - condition: not
            conditions:
              - condition: state
                entity_id: cover.badezimmer
                state: closed
          - condition: template
            value_template: >
              {{ (trigger.id == 'periodic_check' and
              (state_attr('cover.badezimmer','current_position') | int(0)) > 80)
                 or (trigger.id != 'periodic_check' and (state_attr('cover.badezimmer','current_position') | int(0) - positionen['cover.badezimmer']) | abs > 5) }}
        sequence:
          - action: cover.stop_cover
            target:
              entity_id: cover.badezimmer
          - delay:
              seconds: 1
          - action: cover.set_cover_position
            target:
              entity_id: cover.badezimmer
            data:
              position: "{{ positionen['cover.badezimmer'] }}"
          - delay:
              seconds: 20
          # Zu weit zugefahren? Nicht nur "ganz zu": bei Drift bleibt der
          # Rolladen auch mal auf halbem Weg stehen, sein State ist dann
          # "open" und die Korrektur lief nie an.
          - if:
              - condition: template
                value_template: >-
                  {{ is_state('cover.badezimmer', 'closed')
                     or (state_attr('cover.badezimmer', 'current_position') is not none
                            and state_attr('cover.badezimmer', 'current_position') | int(0)
                                < positionen['cover.badezimmer'] - drift_toleranz) }}
            then:
              - action: cover.set_cover_position
                target:
                  entity_id: cover.badezimmer
                data:
                  position: "{{ positionen['cover.badezimmer'] }}"
              - action: logbook.log
                data:
                  entity_id: cover.badezimmer
                  name: Verschattung Nord/Ost
                  message: >-
                    Positions-Drift erkannt (Ziel
                    {{ positionen['cover.badezimmer'] }}%, tatsächlich
                    {{ state_attr('cover.badezimmer', 'current_position') }}%) -
                    Zielposition erneut angefahren.
      - alias: Bad - Öffnen
        conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: bad_open
              - condition: and
                conditions:
                  - condition: trigger
                    id: periodic_check
                  - condition: numeric_state
                    entity_id: sensor.klima_bad_temperature
                    below: 21
          - condition: not
            conditions:
              - condition: state
                entity_id: cover.badezimmer
                state: closed
        sequence:
          - action: cover.open_cover
            target:
              entity_id: cover.badezimmer
      - alias: WC - Schließen
        conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: wc_close
              - condition: and
                conditions:
                  - condition: trigger
                    id: periodic_check
                  - condition: numeric_state
                    entity_id: sensor.klima_wc_temperature
                    above: 23
          # Regen + kühl draußen - dann bringt Verschatten nichts, siehe
          # description.
          - condition: template
            value_template: "{{ not regen_kuehl }}"
          - condition: not
            conditions:
              - condition: state
                entity_id: cover.wc
                state: closed
          - condition: template
            value_template: >
              {{ (trigger.id == 'periodic_check' and
              (state_attr('cover.wc','current_position') | int(0)) > 80)
                 or (trigger.id != 'periodic_check' and (state_attr('cover.wc','current_position') | int(0) - positionen['cover.wc']) | abs > 5) }}
        sequence:
          - action: cover.stop_cover
            target:
              entity_id: cover.wc
          - delay:
              seconds: 1
          - action: cover.set_cover_position
            target:
              entity_id: cover.wc
            data:
              position: "{{ positionen['cover.wc'] }}"
          - delay:
              seconds: 20
          # Zu weit zugefahren? Nicht nur "ganz zu": bei Drift bleibt der
          # Rolladen auch mal auf halbem Weg stehen, sein State ist dann
          # "open" und die Korrektur lief nie an.
          - if:
              - condition: template
                value_template: >-
                  {{ is_state('cover.wc', 'closed')
                     or (state_attr('cover.wc', 'current_position') is not none
                            and state_attr('cover.wc', 'current_position') | int(0)
                                < positionen['cover.wc'] - drift_toleranz) }}
            then:
              - action: cover.set_cover_position
                target:
                  entity_id: cover.wc
                data:
                  position: "{{ positionen['cover.wc'] }}"
              - action: logbook.log
                data:
                  entity_id: cover.wc
                  name: Verschattung Nord/Ost
                  message: >-
                    Positions-Drift erkannt (Ziel
                    {{ positionen['cover.wc'] }}%, tatsächlich
                    {{ state_attr('cover.wc', 'current_position') }}%) -
                    Zielposition erneut angefahren.
      - alias: WC - Öffnen
        conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: wc_open
              - condition: and
                conditions:
                  - condition: trigger
                    id: periodic_check
                  - condition: numeric_state
                    entity_id: sensor.klima_wc_temperature
                    below: 21
          - condition: not
            conditions:
              - condition: state
                entity_id: cover.wc
                state: closed
        sequence:
          - action: cover.open_cover
            target:
              entity_id: cover.wc
      - alias: Wohnzimmer + Terrasse - Schließen (nach Küchentemperatur)
        conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: wz_terrasse_close
              - condition: and
                conditions:
                  - condition: trigger
                    id: periodic_check
                  - condition: numeric_state
                    entity_id: sensor.klima_kuche_temperature
                    above: 23
          # Regen + kühl draußen - dann bringt Verschatten nichts, siehe
          # description.
          - condition: template
            value_template: "{{ not regen_kuehl }}"
        sequence:
          - repeat:
              for_each:
                - cover: cover.wohnzimmer
                  check_door: false
                - cover: cover.terrasse
                  check_door: true
              sequence:
                - if:
                    - condition: template
                      value_template: >
                        {{ (not repeat.item.check_door or not terrasse_gesperrt)
                           and not is_state(repeat.item.cover, 'closed')
                           and ( (trigger.id == 'periodic_check' and (state_attr(repeat.item.cover,'current_position') | int(0)) > 80)
                                 or (trigger.id != 'periodic_check' and (state_attr(repeat.item.cover,'current_position') | int(0) - positionen[repeat.item.cover]) | abs > 5) ) }}
                  then:
                    - action: cover.stop_cover
                      target:
                        entity_id: "{{ repeat.item.cover }}"
                    - delay:
                        seconds: 1
                    - action: cover.set_cover_position
                      target:
                        entity_id: "{{ repeat.item.cover }}"
                      data:
                        position: "{{ positionen[repeat.item.cover] }}"
                    - delay:
                        seconds: 20
                    - if:
                        - condition: template
                          value_template: >-
                            {{ is_state(repeat.item.cover, 'closed')
                               or (state_attr(repeat.item.cover, 'current_position') is not none
                                      and state_attr(repeat.item.cover, 'current_position') | int(0)
                                          < positionen[repeat.item.cover] - drift_toleranz) }}
                      then:
                        - action: cover.set_cover_position
                          target:
                            entity_id: "{{ repeat.item.cover }}"
                          data:
                            position: "{{ positionen[repeat.item.cover] }}"
                        - action: logbook.log
                          data:
                            entity_id: "{{ repeat.item.cover }}"
                            name: Verschattung Nord/Ost
                            message: >-
                              Positions-Drift erkannt (Ziel
                              {{ positionen[repeat.item.cover] }}%, tatsächlich
                              {{ state_attr(repeat.item.cover,'current_position') }}%)
                              - Zielposition erneut angefahren.
      - alias: Wohnzimmer + Terrasse - Öffnen (nach Küchentemperatur)
        conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: wz_terrasse_open
              - condition: and
                conditions:
                  - condition: trigger
                    id: periodic_check
                  - condition: numeric_state
                    entity_id: sensor.klima_kuche_temperature
                    below: 21
        sequence:
          - repeat:
              for_each:
                - cover.wohnzimmer
                - cover.terrasse
              sequence:
                - if:
                    - condition: template
                      value_template: "{{ not is_state(repeat.item, 'closed') }}"
                  then:
                    - action: cover.open_cover
                      target:
                        entity_id: "{{ repeat.item }}"
      - alias: Regen + kühl - alle 5 aktiv öffnen (überstimmt Innentemp)
        conditions:
          # Bewusst OHNE Trigger-Einschränkung: regen_kuehl allein
          # entscheidet, unabhängig davon, welcher der zwölf Trigger den
          # Lauf ausgelöst hat. Mit einer Einschränkung auf
          # regen_kuehl_open/periodic_check würde z.B. ein
          # Innentemp-Trigger (etwa wz_terrasse_close) zwar den passenden
          # Schließen-Zweig korrekt blockieren (not regen_kuehl), aber
          # keinen Zweig mehr matchen lassen - die Rolladen blieben dann
          # bis zu 10 Minuten (nächster periodic_check) unangetastet statt
          # sofort hochzufahren.
          - condition: template
            value_template: "{{ regen_kuehl }}"
        sequence:
          - repeat:
              for_each:
                - cover: cover.schlafzimmer
                  respect_schlafzimmer_lock: true
                - cover: cover.badezimmer
                  respect_schlafzimmer_lock: false
                - cover: cover.wc
                  respect_schlafzimmer_lock: false
                - cover: cover.wohnzimmer
                  respect_schlafzimmer_lock: false
                - cover: cover.terrasse
                  respect_schlafzimmer_lock: false
              sequence:
                - if:
                    - condition: template
                      value_template: >-
                        {{ not is_state(repeat.item.cover, 'closed')
                           and not (repeat.item.respect_schlafzimmer_lock and schlafzimmer_gesperrt) }}
                  then:
                    - action: cover.open_cover
                      target:
                        entity_id: "{{ repeat.item.cover }}"
      - alias: Außentemp > 25°C UND Vorhersage > 25°C - alle 5 proaktiv schließen
        conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: forecast_close_all
              - condition: and
                conditions:
                  - condition: trigger
                    id: periodic_check
                  - condition: numeric_state
                    entity_id: sensor.wkh_temperature_outside
                    above: 25
          - condition: numeric_state
            entity_id: sensor.vorhersage_max_temp_heute
            above: 25
        sequence:
          - repeat:
              for_each:
                - cover: cover.schlafzimmer
                  check_door: false
                - cover: cover.badezimmer
                  check_door: false
                - cover: cover.wc
                  check_door: false
                - cover: cover.wohnzimmer
                  check_door: false
                - cover: cover.terrasse
                  check_door: true
              sequence:
                - if:
                    - condition: template
                      value_template: >
                        {{ (not repeat.item.check_door or not terrasse_gesperrt)
                           and not is_state(repeat.item.cover, 'closed')
                           and not (repeat.item.cover == 'cover.schlafzimmer' and schlafzimmer_gesperrt)
                           and ( (trigger.id == 'periodic_check' and (state_attr(repeat.item.cover,'current_position') | int(0)) > 80)
                                 or (trigger.id != 'periodic_check' and (state_attr(repeat.item.cover,'current_position') | int(0) - positionen[repeat.item.cover]) | abs > 5) ) }}
                  then:
                    - action: cover.stop_cover
                      target:
                        entity_id: "{{ repeat.item.cover }}"
                    - delay:
                        seconds: 1
                    - action: cover.set_cover_position
                      target:
                        entity_id: "{{ repeat.item.cover }}"
                      data:
                        position: "{{ positionen[repeat.item.cover] }}"
                    - delay:
                        seconds: 20
                    - if:
                        - condition: template
                          value_template: >-
                            {{ is_state(repeat.item.cover, 'closed')
                               or (state_attr(repeat.item.cover, 'current_position') is not none
                                      and state_attr(repeat.item.cover, 'current_position') | int(0)
                                          < positionen[repeat.item.cover] - drift_toleranz) }}
                      then:
                        - action: cover.set_cover_position
                          target:
                            entity_id: "{{ repeat.item.cover }}"
                          data:
                            position: "{{ positionen[repeat.item.cover] }}"
                        - action: logbook.log
                          data:
                            entity_id: "{{ repeat.item.cover }}"
                            name: Verschattung Nord/Ost
                            message: >-
                              Positions-Drift erkannt (Ziel
                              {{ positionen[repeat.item.cover] }}%, tatsächlich
                              {{ state_attr(repeat.item.cover,'current_position') }}%)
                              - Zielposition erneut angefahren.
      - alias: Außentemp unter 25°C - öffnen (nur wenn nicht komplett geschlossen)
        conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: outdoor_open_all
              - condition: and
                conditions:
                  - condition: trigger
                    id: periodic_check
                  - condition: numeric_state
                    entity_id: sensor.wkh_temperature_outside
                    below: 25
        sequence:
          - repeat:
              for_each:
                - cover.schlafzimmer
                - cover.badezimmer
                - cover.wc
                - cover.wohnzimmer
                - cover.terrasse
              sequence:
                - if:
                    - condition: template
                      value_template: >-
                        {{ not is_state(repeat.item, 'closed')
                           and not (repeat.item == 'cover.schlafzimmer'
                                    and schlafzimmer_gesperrt) }}
                  then:
                    - action: cover.open_cover
                      target:
                        entity_id: "{{ repeat.item }}"
# queued statt restart: die Drift-Korrektur wartet 20 Sekunden und prüft dann
# nach. Bei "restart" bricht jeder in dieser Zeit feuernde der zwölf Trigger den
# Lauf ab - also genau die Korrektur, die gegen den Overshoot vom 26.07. gebaut
# wurde. Vertretbar, weil Temperaturen träge sind: auf der Nordseite kommt die
# Sonne höchstens abends kurz vorbei, dicht aufeinanderfolgende Trigger sind
# also nicht zu erwarten.
mode: queued
max: 5
max_exceeded: silent
