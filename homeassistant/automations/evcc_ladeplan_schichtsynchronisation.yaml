alias: EVCC Ladeplan Schichtsynchronisation
description: >
  Koppelt die wiederkehrenden evcc-Ladepläne des Fahrzeugs "Highlander" an
  die Schichterkennung aus "Rolladen Schlafzimmer (Schichterkennung über
  Standort)" (input_select.schichtmodus_schlafzimmer). Grund: die Frau des
  Hauses nutzt die evcc-App nicht und steckt das Auto einfach an - ohne
  diese Automation wäre entweder der falsche oder gar kein Ladeplan aktiv.

  ZUORDNUNG (evcc-seitig als wiederkehrender Plan je Schicht angelegt):
    frueh -> switch.evcc_highlander_repeating_plan_2
    nacht -> switch.evcc_highlander_repeating_plan_3
    spaet -> switch.evcc_highlander_repeating_plan_4
  Es ist immer höchstens einer der drei Switches an, alle anderen aus.

  Der Lademodus selbst (select für pv/minpv/now/off) wird hier bewusst NICHT
  angefasst - er steht laut Vorgabe dauerhaft auf "minpv" und soll nicht
  automatisiert werden.

  "KEINE" BEDEUTET NICHT "KEIN SCHICHTDIENST" (18.10.2026 - WICHTIGE
  KORREKTUR):
  Ursprünglich wurde bei Schichtmodus "keine" der Ladeplan komplett
  ausgeschaltet. Im Betrieb zeigte sich: input_select.schichtmodus_schlafzimmer
  geht in rolladen_schlafzimmer_schichterkennung.yaml MEHRMALS TÄGLICH auf
  "keine" zurück (Aufwach-Erkennung, 16:00-Sicherheitsnetz, Boden-Zeit nach
  Spätschicht, 21:30-Reset von "frueh") - das markiert dort nur das Ende der
  jeweiligen Schlafschutz-Phase, nicht "in absehbarer Zeit kein Schichtdienst
  mehr". Wird z.B. nach einer Nachtschicht morgens aufgewacht, steht der
  Modus oft schon um 09:30 wieder auf "keine", obwohl am selben Abend die
  nächste Nachtschicht ansteht - der Ladeplan wurde dadurch Stunden vor dem
  eigentlichen Ladebedarf wieder deaktiviert.
  Diese Automation reagiert deshalb NICHT MEHR auf "keine": wechselt der
  Schichtmodus auf "keine", bleibt der zuletzt aktivierte Plan-Switch
  unverändert aktiv, bis tatsächlich eine neue Schicht (frueh/spaet/nacht)
  erkannt wird. Echtes "kein Schichtdienst" (Urlaub) wird stattdessen über
  input_boolean.urlaubsmodus_schlafzimmer erkannt - erst dann werden alle
  drei Pläne ausgeschaltet.
  Nebeneffekt, bewusst in Kauf genommen und durch die Mo-Fr-Begrenzung der
  Pläne in evcc selbst entschärft: an echten freien Tagen ohne Urlaubsmodus
  bleibt der zuletzt aktive Plan stehen, auch wenn er an diesem Tag nicht
  gebraucht wird. Am Wochenende wirkt sich das aber gar nicht aus, da die
  Pläne in evcc ohnehin nur Mo-Fr laufen; relevant bleibt nur ein einzelner
  freier Werktag zwischen zwei Schichten. evcc lädt dort ggf. etwas früher
  auf 100% als nötig - harmlos gegenüber der vorherigen Fehlrichtung (Ladeplan fehlt am
  Arbeitstag).

  EVCC/HA REAGIEREN UNZUVERLÄSSIG - RETRY MIT VERIFIKATION (29.09.2026):
  Im Test blieb nach einem Schichtwechsel teils der alte Plan-Switch an
  (v.a. bei Übergängen zu "keine" aus "spaet"/"nacht" - inzwischen ohnehin
  entschärft, siehe oben), obwohl switch.turn_off/turn_on erfolgreich
  aufgerufen wurden - die evcc-eigene Oberfläche zeigt laut Beobachtung
  ebenfalls öfter einen falschen bzw. keinen aktiven Plan an und reagiert
  auf Schalter-Klicks teils verzögert oder gar nicht. Home Assistant setzt
  den Switch-State nach dem Service-Aufruf vermutlich optimistisch, bevor
  evcc die Änderung bestätigt bzw. bevor der Integrations-Coordinator neu
  gepollt hat - deshalb reicht ein einmaliger Schaltbefehl nicht zuverlässig.
  Die Automation schaltet deshalb in einer Schleife (max. 3 Versuche): nach
  turn_off/turn_on werden 5 Sekunden gewartet, per
  homeassistant.update_entity ein sofortiger Reload der drei Switch-Entities
  erzwungen (statt auf den nächsten regulären Poll zu warten) und danach der
  Soll/Ist-Zustand erneut geprüft. Erst wenn er passt oder 3 Versuche
  aufgebraucht sind, endet die Schleife. Bleibt es nach 3 Versuchen falsch,
  wird das explizit als Fehler ins Logbuch geschrieben (nicht nur stillos
  dem 10-Minuten-Backup-Trigger überlassen) - damit sichtbar ist, dass evcc
  manuell geprüft werden muss.

  ROBUSTHEIT: neben dem State-Trigger auf den Schichtmodus (und jetzt auch
  auf den Urlaubsmodus) läuft ein 10-Minuten-Backup-Trigger, der denselben
  Soll/Ist-Abgleich (inkl. Retry-Schleife) macht - falls z.B. ein
  Plan-Switch manuell in der evcc-App umgestellt wurde, ein Event
  verlorenging (HA-Neustart, verpasster State-Change) oder selbst die 3
  Versuche direkt nach dem Schichtwechsel nicht ausgereicht haben. Geloggt
  wird nur, wenn tatsächlich etwas geändert werden musste, damit das
  Logbuch nicht bei jedem 10-Minuten-Lauf vollgeschrieben wird.

  Voraussetzung: input_select.schichtmodus_schlafzimmer wird bereits von
  rolladen_schlafzimmer_schichterkennung.yaml gepflegt - diese Automation
  liest sie nur, ändert sie nie.

  BEKANNTE EINSCHRÄNKUNG: diese Automation erkennt selbst keine Schicht,
  sondern spiegelt nur den aktuellen Wert von
  input_select.schichtmodus_schlafzimmer auf die Plan-Switches. Erkennt
  rolladen_schlafzimmer_schichterkennung.yaml eine Schicht verspätet oder
  gar nicht (siehe deren eigene bekannte Lücken, z.B. verpasstes
  Ankunfts-Event, GPS-Sprung), bleibt hier ebenso lange der falsche Plan
  aktiv.

  mode: queued statt single - die Retry-Schleife kann bis zu ca. 30
  Sekunden dauern; bei "single" würde ein während dieser Zeit ausgelöster
  10-Minuten-Backup-Trigger (oder ein sehr kurz aufeinanderfolgender
  Schichtwechsel) sonst kommentarlos verworfen.
triggers:
  - trigger: state
    entity_id: input_select.schichtmodus_schlafzimmer
    id: schichtwechsel
  - trigger: state
    entity_id: input_boolean.urlaubsmodus_schlafzimmer
    to: "on"
    id: urlaub_start
  - trigger: time_pattern
    minutes: "/10"
    id: periodic_check
conditions: []
actions:
  - variables:
      schicht: "{{ states('input_select.schichtmodus_schlafzimmer') }}"
      urlaub: "{{ is_state('input_boolean.urlaubsmodus_schlafzimmer', 'on') }}"
      plan_switches:
        frueh: switch.evcc_highlander_repeating_plan_2
        nacht: switch.evcc_highlander_repeating_plan_3
        spaet: switch.evcc_highlander_repeating_plan_4
      # "keine" heisst nur "gerade keine Schlafschutz-Phase", NICHT "kein
      # Schichtdienst mehr nötig" (siehe Beschreibung oben) - deshalb wird
      # bei "keine" (ohne Urlaub) der Sync komplett übersprungen, statt auf
      # "aus" zu schalten. Nur echter Urlaub erzwingt "aus".
      sync_ueberspringen: "{{ not urlaub and schicht == 'keine' }}"
      soll_switch: "{{ '' if urlaub else plan_switches.get(schicht, '') }}"
  - if:
      - condition: template
        value_template: "{{ not sync_ueberspringen }}"
    then:
      - variables:
          aktive_switches: >-
            {{ expand(plan_switches.values() | list)
               | selectattr('state', 'eq', 'on')
               | map(attribute='entity_id') | sort | list }}
          soll_aktiv: "{{ [soll_switch] if soll_switch != '' else [] }}"
          aenderung_noetig: "{{ aktive_switches != soll_aktiv }}"
          # Für die Logbuch-Meldung am Ende: Ausgangszustand und ob überhaupt
          # etwas zu tun war merken, bevor die Schleife aktive_switches/
          # aenderung_noetig überschreibt.
          aktive_switches_vorher: "{{ aktive_switches }}"
          sync_erforderlich: "{{ aenderung_noetig }}"
      # Bis zu 3 Versuche: schalten, kurz warten, Entities zwangsweise neu
      # pollen (statt auf den nächsten regulären Poll-Zyklus zu warten) und
      # danach erneut prüfen. Läuft nur an, solange noch eine Abweichung
      # besteht (aenderung_noetig) - bei bereits korrektem Zustand macht die
      # while-Vorbedingung die Schleife zum No-Op.
      - repeat:
          while:
            - condition: template
              value_template: "{{ aenderung_noetig and repeat.index <= 3 }}"
          sequence:
            - action: switch.turn_off
              target:
                entity_id: >-
                  {{ plan_switches.values() | reject('eq', soll_switch) | list }}
              data: {}
            - if:
                - condition: template
                  value_template: "{{ soll_switch != '' }}"
              then:
                - action: switch.turn_on
                  target:
                    entity_id: "{{ soll_switch }}"
                  data: {}
            - delay:
                seconds: 5
            - action: homeassistant.update_entity
              target:
                entity_id: "{{ plan_switches.values() | list }}"
              data: {}
            - variables:
                versuche: "{{ repeat.index }}"
                aktive_switches: >-
                  {{ expand(plan_switches.values() | list)
                     | selectattr('state', 'eq', 'on')
                     | map(attribute='entity_id') | sort | list }}
                aenderung_noetig: "{{ aktive_switches != soll_aktiv }}"
      - if:
          - condition: template
            value_template: "{{ sync_erforderlich }}"
        then:
          - if:
              - condition: template
                value_template: "{{ aenderung_noetig }}"
            then:
              - action: logbook.log
                data:
                  entity_id: input_select.schichtmodus_schlafzimmer
                  name: EVCC Ladeplan Schichtsynchronisation
                  message: >-
                    FEHLER: {{ 'Urlaub' if urlaub else
                       'Schichtmodus "' ~ schicht ~ '"' }} -> Ladeplan
                    {{ soll_switch.split('.')[-1] if soll_switch != '' else
                       'aus' }} nach 3 Versuchen NICHT übernommen - evcc/HA
                    meldet weiterhin aktiv:
                    {{ aktive_switches | join(', ') if aktive_switches else
                       'keiner' }}. Bitte evcc-App und Entwicklerwerkzeuge ->
                    Zustände manuell prüfen.
            else:
              - action: logbook.log
                data:
                  entity_id: input_select.schichtmodus_schlafzimmer
                  name: EVCC Ladeplan Schichtsynchronisation
                  message: >-
                    {{ 'Urlaub' if urlaub else
                       'Schichtmodus "' ~ schicht ~ '"' }} -> Ladeplan
                    {{ soll_switch.split('.')[-1] if soll_switch != '' else
                       'aus' }} aktiviert
                    {{ '(erst im ' ~ versuche ~ '. Versuch übernommen)'
                       if versuche | default(1) | int > 1 else '' }}
                    (vorher aktiv: {{ aktive_switches_vorher | join(', ')
                       if aktive_switches_vorher else 'keiner' }}).
mode: queued
max: 3
